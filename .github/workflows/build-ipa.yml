name: Build Morg’s LED IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select latest installed Xcode 26 SDK
        run: |
          XCODE="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' -print -quit)"
          if [ -z "$XCODE" ]; then
            echo "Xcode 26 is not installed on this runner image."
            ls -1 /Applications | grep -i Xcode || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build device app
        run: |
          xcodebuild \
            -project Luma.xcodeproj \
            -scheme Luma \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package unsigned IPA
        run: |
          APP="build/DerivedData/Build/Products/Release-iphoneos/Morgs LED.app"
          test -d "$APP"
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/"Morgs LED.app"
          (cd build && /usr/bin/zip -qry Morgs-LED-unsigned.ipa Payload)
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Morgs-LED-unsigned-ipa
          path: build/Morgs-LED-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
