name: Build Morg’s LED IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select latest installed Xcode 26 SDK
        run: |
          XCODE="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' -print -quit)"
          if [ -z "$XCODE" ]; then
            echo "Xcode 26 is not installed on this runner image."
            ls -1 /Applications | grep -i Xcode || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks
      - name: Install XcodeGen
        run: |
          VERSION="2.46.0"
          curl --fail --location --retry 6 --retry-delay 4 --retry-all-errors --connect-timeout 20 --max-time 240 \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${VERSION}/xcodegen.zip" \
            --output "$RUNNER_TEMP/xcodegen.zip" || { \
              echo "Direct release download failed; trying Homebrew as a fallback."; \
              brew install xcodegen; \
              exit 0; \
            }
          mkdir -p "$RUNNER_TEMP/xcodegen"
          ditto -x -k "$RUNNER_TEMP/xcodegen.zip" "$RUNNER_TEMP/xcodegen"
          BINARY="$(find "$RUNNER_TEMP/xcodegen" -type f -name xcodegen -perm -111 -print -quit)"
          if [ -z "$BINARY" ]; then
            echo "XcodeGen binary was not found in the release archive."
            find "$RUNNER_TEMP/xcodegen" -maxdepth 3 -type f -print
            exit 1
          fi
          sudo install -m 0755 "$BINARY" /usr/local/bin/xcodegen
          xcodegen --version
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build device app
        run: |
          xcodebuild \
            -project Luma.xcodeproj \
            -scheme Luma \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package unsigned IPA
        run: |
          APP="build/DerivedData/Build/Products/Release-iphoneos/Morgs LED.app"
          test -d "$APP"
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/"Morgs LED.app"
          (cd build && /usr/bin/zip -qry Morgs-LED-unsigned.ipa Payload)
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Morgs-LED-unsigned-ipa
          path: build/Morgs-LED-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
