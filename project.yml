name: Luma
options:
  bundleIdPrefix: com.tiernandawg
  deploymentTarget:
    iOS: "26.0"
targets:
  Luma:
    type: application
    platform: iOS
    sources:
      - BLEDOMGlass
    info:
      path: Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.tiernandawg.morgsled
            CFBundleURLSchemes:
              - morgsled
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tiernandawg.morgsled
        PRODUCT_NAME: "Morgs LED"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleDisplayName: "Morg’s LED"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Morg’s LED uses the microphone to react to nearby music and sound when you enable a sound-reactive mode."
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Morg’s LED uses Bluetooth to find and control your nearby LED strip. No account or internet connection is required."
        INFOPLIST_KEY_NSBluetoothPeripheralUsageDescription: "Morg’s LED uses Bluetooth to control your LED strip."
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
